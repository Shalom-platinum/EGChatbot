name: Azure App Services - Eyemasters API (TEST)

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - 'AAA/**'
  pull_request:
    branches:
      - "XXX"
      - 'AAA/**'

jobs:
  build-and-deploy:
    environment: Develop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.300'  # or your target version

      - name: Restore dependencies
        run: |
          dotnet restore ./src-net/EGChatbot.Api/EGChatbot.Api.csproj


      - name: Build
        run: |
          dotnet build ./src-net/EGChatbot.Api/EGChatbot.Api.csproj --configuration Release --no-restore

      - name: Publish to folder
        run: dotnet publish ./src-net/EGChatbot.Api/EGChatbot.Api.csproj  -c Release -o ./src-net/publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'eyemasters-api'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./src-net/publish
