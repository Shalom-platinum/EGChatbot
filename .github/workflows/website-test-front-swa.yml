 
name: Azure Static Web Apps CI/CD - EG Group Chat UI (TEST)
on:
  # push:
  #   branches:
  #     - 'aaa/XXXXX'
  #     - 'main'
  #     # - 'feat/abdulmalik_20260325_ui_api_rework'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    # if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    environment: Develop
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      - name: Check SWA token presence
        env:
          SWA_TOKEN: ${{ secrets.EGCHATBOT_SWA_TOKEN_CLIENT }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "❌ SWA token is MISSING"
            exit 1
          else
            echo "✅ SWA token is PRESENT"
          fi
      - name: Install and build frontend
        working-directory: src-node
        run: |
          npm install --legacy-peer-deps
          npm run build
          cp staticwebapp.config.json dist/staticwebapp.config.json
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.EGCHATBOT_SWA_TOKEN_CLIENT }}
          action: "upload"
          app_location: "src-node/dist" # Prebuilt app artifacts path
          skip_app_build: true
          output_location: "" # Not used when skip_app_build is true
 








